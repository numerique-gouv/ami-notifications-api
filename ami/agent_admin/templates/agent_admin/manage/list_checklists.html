{% extends "agent_admin/base.html" %}
{% load dsfr_tags %}

{% block content %}
  <h1>Gestion des listes d’étapes</h1>

  <div class="fr-table fr-table--multiline">
    <div class="fr-table__wrapper">
      <div class="fr-table__container">
        <div class="fr-table__content">
          <table id="catalog">
            <tbody>
              {% for checklist in object_list %}
                <tr>
                  <td>
                    {{ checklist.external_id }}
                  </td>
                  <td>
                    <span class="{{ checklist.icon }}"></span> {{ checklist.title }}
                  </td>
                  <td>
                    <a href="{% url 'agent-admin:manage:edit-checklist' checklist.id %}" class="fr-link"><span class="fr-text--xs">modifier</span></a>
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  {% dsfr_button_group btn_group %}
{% endblock %}
