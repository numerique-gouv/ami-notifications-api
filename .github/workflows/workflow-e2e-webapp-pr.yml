name: e2e pr
# Reusable, invoqué uniquement par e2e-after-deploy.yml une fois Scalingo déployé (jamais
# directement sur pull_request : ça recréerait le deadlock où Scalingo attend un check e2e qui
# attend lui-même Scalingo, cf. ADR CI GitHub Actions). Les jobs requis (lint-and-format/python/
# mobile-app) sont couverts indépendamment par pytest.yml (on: push — un push sur une branche de
# PR déclenche déjà ce workflow, pas besoin de le rejouer ici).
on:
  workflow_call:
    inputs:
      pr_number:
        description: "Numéro de la PR ouverte dont ce SHA est le head"
        type: number
        required: true
      source_sha:
        description: "SHA du commit d'ami-notifications-api dont Scalingo vient de confirmer le déploiement"
        type: string
        required: true
      checkout_ref:
        description: "Nom de la branche de la PR (head.ref)"
        type: string
        required: true

jobs:
  e2e:
    name: run e2e (PR update)
    uses: ./.github/workflows/workflow-e2e-webapp-shared.yml
    with:
      run_webapp: CI
      pr_number: ${{ inputs.pr_number }}
      source_sha: ${{ inputs.source_sha }}
      checkout_ref: ${{ inputs.checkout_ref }}
      wait_for_scalingo_step: false # l'appelant (e2e-after-deploy.yml) a déjà vérifié le succès
    secrets: inherit
