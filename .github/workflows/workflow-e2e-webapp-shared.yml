name: e2e shared
# Logique commune, appelée par les workflows trigger after deploy (automatique) et le manuel :
# lance l'e2e sur ami-system-tests puis, si pr_number != 0, commente la PR d'origine avec le
# rapport Allure. le rapport étant toujours conservé dans les artefacts du run de la CI.
# https://github.com/numerique-gouv/ami-notifications-api/actions/runs
on:
  workflow_call:
    inputs:
      run_webapp:
        description: "nom de la suite webapp à lancer (test-suites.ts, ex: short, CI, all) — vide = ne pas lancer"
        type: string
        default: ''
      run_android:
        description: "nom de la suite android à lancer (test-suites.ts) — vide = ne pas lancer"
        type: string
        default: ''
      run_ios:
        description: "nom de la suite ios à lancer (test-suites.ts) — vide = ne pas lancer"
        type: string
        default: ''
      run_old_device:
        description: "les applications mobile si utilisées doivent être d'anciens appareils (android, ios) avec un ancien os (android)"
        type: boolean
        default: true
      pr_number:
        description: "0 = pas de PR associée (push/tag) → pas de commentaire de PR"
        type: number
        default: 0
      source_sha:
        description: "SHA du commit d'ami-notifications-api dont on attend le déploiement Scalingo avant de lancer les tests"
        type: string
        required: true
      checkout_ref:
        description: "ref (branche/tag/sha) d'ami-system-tests à checkout — doit être égal à la ref de jobs.e2e-launch.uses: [...]@ref"
        type: string
        default: main

jobs:
  e2e-launch:
    name: trigger an e2e run in ami-system-tests
    uses: numerique-gouv/ami-system-tests/.github/workflows/workflow-e2e-main.yml@main
    with:
      run_webapp: ${{ inputs.run_webapp }}
      run_android: ${{ inputs.run_android }}
      run_ios: ${{ inputs.run_ios }}
      run_old_device: ${{ inputs.run_old_device }}
      source_repo: ${{ github.repository }}
      source_sha: ${{ inputs.source_sha }}
      pr_number: ${{ inputs.pr_number }}
      checkout_ref: ${{ inputs.checkout_ref }} # la même branche/ref que uses de préférence
    secrets: inherit
    
  e2e-report:
    name: uses output of e2e run in ami-system-tests to report in pr
    needs: e2e-launch
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.pr_number != 0 }}
    permissions:
      pull-requests: write
      checks: write
    steps:
      - name: Charger le rapport de test pour le mettre dans la PR
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.e2e-launch.outputs.allure_report }}
          path: allure-report

      # "on status" se déclenche depuis le HEAD de main et pas depuis le commit qui les déclenche
      # Il faut donc l'associer aux check de la branche "à la main"
      - name: Publier un check-run explicite sur le commit de la PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.source_sha }}
          RESULT: ${{ needs.e2e-launch.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          conclusion="failure"
          case "$RESULT" in
            success) conclusion="success" ;;
            skipped) conclusion="neutral" ;;
            cancelled) conclusion="cancelled" ;;
          esac

          if [ -f allure-report/summary.json ]; then
            status=$(jq -r '.status' allure-report/summary.json)
            total=$(jq -r '.stats.total // 0' allure-report/summary.json)
            passed=$(jq -r '.stats.passed // 0' allure-report/summary.json)
            broken=$(jq -r '.stats.broken // 0' allure-report/summary.json)
            summary="Rapport Allure : **$status** — $passed passed / $broken broken / $total total."
          else
            summary="Pas de rapport Allure disponible (résultat du job e2e-launch : \`$RESULT\`)."
          fi

          gh api "repos/$REPO/check-runs" \
            -f name="e2e (ami-system-tests)" \
            -f head_sha="$SHA" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f details_url="$RUN_URL" \
            -f "output[title]=e2e (ami-system-tests)" \
            -f "output[summary]=$summary"

      # "on status" se déclenche depuis le HEAD de main et pas depuis le commit qui les déclenche
      # allure-framework/allure-action@v0 s'en rend compte même en forgeant un input pointant la bonne PR
      # On commente la PR nous-même
      - name: Commenter la PR d'origine
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          RESULT: ${{ needs.e2e-launch.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- e2e-report:pr-$PR -->"

          if [ -f allure-report/summary.json ]; then
            status=$(jq -r '.status' allure-report/summary.json)
            total=$(jq -r '.stats.total // 0' allure-report/summary.json)
            passed=$(jq -r '.stats.passed // 0' allure-report/summary.json)
            broken=$(jq -r '.stats.broken // 0' allure-report/summary.json)
            table=$(printf '| Résultat | Total | Passed | Broken |\n|---|---|---|---|\n| %s | %s | %s | %s |' "$status" "$total" "$passed" "$broken")
          else
            table="Pas de rapport Allure disponible (résultat du job e2e-launch : \`$RESULT\`)."
          fi

          body_file="${RUNNER_TEMP}/pr-comment-body.md"
          {
            echo "$marker"
            echo "### Rapport e2e (ami-system-tests)"
            echo
            echo "$table"
            echo
            echo "[Voir le run et ses artefacts]($RUN_URL#artifacts)"
          } > "$body_file"

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))] | last | .id // empty")

          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -F body=@"$body_file"
          else
            gh api "repos/$REPO/issues/$PR/comments" -X POST -F body=@"$body_file"
          fi

