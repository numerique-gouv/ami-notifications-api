name: workflow-e2e-webapp-shared.yml
# Logique commune, appelée par les workflows fins par déclencheur (workflow-e2e-webapp-*.yml) :
# lance l'e2e sur ami-system-tests puis, si pr_number != 0, commente la PR d'origine avec le
# rapport Allure. Chaque appelant fixe une config simple, sans condition ni shell.
on:
  workflow_call:
    inputs:
      run_webapp:
        description: "nom de la suite webapp à lancer (test-suites.ts, ex: short, CI, all) — vide = ne pas lancer"
        type: string
        default: ''
      run_android:
        description: "nom de la suite android à lancer (test-suites.ts) — vide = ne pas lancer"
        type: string
        default: ''
      run_ios:
        description: "nom de la suite ios à lancer (test-suites.ts) — vide = ne pas lancer"
        type: string
        default: ''
      run_old_device:
        description: "les applications mobile si utilisées doivent être d'anciens appareils (android, ios) avec un ancien os (android)"
        type: boolean
        default: true
      pr_number:
        description: "0 = pas de PR associée (push/tag) → pas de commentaire de PR"
        type: number
        default: 0
      ref_name:
        type: string
        default: staging
      checkout_ref:
        description: "ref (branche/tag/sha) d'ami-system-tests à checkout — doit être égal à la ref de jobs.e2e-launch.uses: [...]@ref"
        type: string
        default: main

jobs:
  e2e-launch:
    name: trigger an e2e run in ami-system-tests
    uses: numerique-gouv/ami-system-tests/.github/workflows/workflow-e2e-main.yml@main
    with:
      ref_name: ${{ inputs.ref_name }}
      run_webapp: ${{ inputs.run_webapp }}
      run_android: ${{ inputs.run_android }}
      run_ios: ${{ inputs.run_ios }}
      run_old_device: ${{ inputs.run_old_device }}
      source_repo: ${{ github.repository }}
      pr_number: ${{ inputs.pr_number }}
      checkout_ref: ${{ inputs.checkout_ref }} # la même branche/ref que uses de préférence
    secrets: inherit

  e2e-report:
    name: uses output of e2e run in ami-system-tests to report in pr
    needs: e2e-launch
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.pr_number != 0 }}
    permissions:
      pull-requests: write
      checks: write
    steps:
      - name: Charger le rapport de test pour le mettre dans la PR
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.e2e-launch.outputs.allure_report }}
          path: allure-report

      - name: show allure content for debug
        run: |
          echo root folder:
          ls .
          echo allure folder
          ls allure-report/
          
      - name: Commenter la PR d'origine
        uses: allure-framework/allure-action@v0
        with:
          report-directory: allure-report
          github-token: ${{ github.token }}
          debug: true
          remote-href: 'https://github.com/numerique-gouv/ami-notifications-api/actions/runs/${{ github.run_id }}#artifacts'
