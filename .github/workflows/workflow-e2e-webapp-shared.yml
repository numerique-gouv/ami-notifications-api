name: e2e shared
# Logique commune, appelée par les workflows trigger after deploy (automatique) et le manuel :
# lance l'e2e sur ami-system-tests (workflow-e2e-main.yml), qui publie les résultats (artefacts JUnit + dumps d'échec par
# plateforme), crée le check « e2e (ami-system-tests) » sur le commit testé et, si pr_number != 0, tient à jour UN commentaire
# sur la PR d'origine (tableau test | résultat | durée | lien Sentry, marqueur `<!-- e2e-report:<dépôt>:pr-<N> -->`).
# Tout le reporting est dans workflow-e2e-main.yml (job `report`) : ce fichier n'a plus de job de rapport.
# Les jobs restent verts même si des tests échouent : le résultat se lit dans le check et le commentaire.
# https://github.com/numerique-gouv/ami-notifications-api/actions/runs
on:
  workflow_call:
    inputs:
      run_webapp:
        description: "nom de la suite webapp à lancer (test-suites.ts : webapp_short = mise au point, webapp_usage = PR/merge/tag, webapp_smoke, webapp_all…) — vide = ne pas lancer"
        type: string
        default: ''
      run_android:
        description: "nom de la suite android à lancer (test-suites.ts : mobile_short = mise au point, mobile_all = PR/merge/tag, mobile_smoke…) — vide = ne pas lancer"
        type: string
        default: ''
      android_device:
        description: "AVD Android au format pixel_<profil>_api<niveau> (pixel_2_api30 = ancien appareil, pixel_8_api36 = récent) ; ne sert que si run_android est renseigné"
        type: string
        default: pixel_2_api30
      apk_source:
        description: "origine de l'APK Android : latest-tag = APK du dernier tag d'ami-app-android (artefact privé app-staging-debug-<tag>, variable AMI_REVIEWAPPS_APP_ID et secret AMI_REVIEWAPPS_PRIVATE_KEY requis, GitHub App ami-reviewapps) ; build = artefact buildé par l'appelant (pas le cas ici : l'API ne build pas d'APK)"
        type: string
        default: latest-tag
      report_label:
        description: "étiquette (lettres, chiffres, - _) quand plusieurs runs e2e rapportent sur la même PR (ex. old-device) : un check et un commentaire par étiquette"
        type: string
        default: ''
      pr_number:
        description: "0 = pas de PR associée (push/tag) → pas de commentaire de PR"
        type: number
        default: 0
      source_sha:
        description: "SHA du commit d'ami-notifications-api dont on attend le déploiement Scalingo avant de lancer les tests"
        type: string
        required: true
      checkout_ref:
        description: "ref (branche/tag/sha) d'ami-system-tests à checkout — doit être égal à la ref de jobs.e2e-launch.uses: [...]@ref"
        type: string
        default: 77-migre-vers-wdio-10 # provisoire, à repasser sur main à la fusion

jobs:
  e2e-launch:
    name: trigger an e2e run in ami-system-tests
    # PROVISOIRE, le temps de la mise au point : la branche 77-migre-vers-wdio-10 d'ami-system-tests porte le job report, les suites
    # webapp_*/mobile_* et les sorties. À repasser sur @main à la fusion (checkout_ref doit rester égal à cette ref).
    uses: numerique-gouv/ami-system-tests/.github/workflows/workflow-e2e-main.yml@77-migre-vers-wdio-10
    # Le workflow appelé ne peut pas dépasser ces permissions : checks (check du commit testé) et pull-requests (commentaire unique).
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      run_webapp: ${{ inputs.run_webapp }}
      run_android: ${{ inputs.run_android }}
      android_device: ${{ inputs.android_device }}
      apk_source: ${{ inputs.apk_source }}
      report_label: ${{ inputs.report_label }}
      source_repo: ${{ github.repository }}
      source_sha: ${{ inputs.source_sha }}
      pr_number: ${{ inputs.pr_number }}
      checkout_ref: ${{ inputs.checkout_ref }} # la même branche/ref que uses de préférence
    secrets: inherit
